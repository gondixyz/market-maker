# Runs on the public mirror only. A push to main whose package.json version has no `v<version>` tag
# yet releases that version: it builds the desktop installers (macOS DMGs for Apple silicon and
# Intel, a Windows installer) and publishes them as a GitHub release, tagging the pushed commit, with
# the version's CHANGELOG.md section and how to install as its notes. A version already tagged
# releases nothing, so only the push that bumps it does. The installers are not signed by a
# developer certificate, so macOS and Windows warn on first launch; the notes say how to open them.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Read the version and whether it is released
        id: version
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the changelog has the version's section
        if: steps.version.outputs.release == 'true'
        run: |
          if ! grep -qx "# ${TAG#v}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '# ${TAG#v}' section"
            exit 1
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}

  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify

  build:
    needs: [plan, verify]
    if: needs.plan.outputs.release == 'true'
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-latest
            installers: dist/*.dmg
          - platform: win
            runner: windows-latest
            installers: dist/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop
      - run: bunx electron-builder --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Write the release notes
        run: |
          awk -v heading="# ${TAG#v}" '
            $0 == heading { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n## Installing\n\n' >> notes.md
          cat .github/release-notes.md >> notes.md
      - name: Publish the release, tagging the pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" installers/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG"
          --notes-file notes.md
